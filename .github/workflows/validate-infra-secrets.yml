# ═══════════════════════════════════════════════════════════════════════════════
# Infrastructure Secrets Health Check
# Proactively validates GH_INFRA_PAT before Terraform/Helmsman workflows fail at checkout.
# Optional repo variable GH_INFRA_PAT_EXPIRES_AT (YYYY-MM-DD) enables expiry warnings.
# ═══════════════════════════════════════════════════════════════════════════════
name: Validate Infrastructure Secrets

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 08:00 UTC
  workflow_dispatch:
    inputs:
      notify_slack:
        description: 'Send Slack notifications on failure or expiry warning?'
        required: false
        default: true
        type: boolean

jobs:
  validate-gh-infra-pat:
    name: Validate GH_INFRA_PAT
    runs-on: ubuntu-latest
    steps:
      - name: Validate GH_INFRA_PAT
        id: validate
        env:
          GH_INFRA_PAT: ${{ secrets.GH_INFRA_PAT }}
          GH_INFRA_PAT_EXPIRES_AT: ${{ vars.GH_INFRA_PAT_EXPIRES_AT }}
          REPO: ${{ github.repository }}
          WARN_DAYS: '14'
        run: |
          set -euo pipefail

          if [ -z "${GH_INFRA_PAT:-}" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "message=GH_INFRA_PAT repository secret is not configured." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          HTTP_CODE=$(curl -sS -D /tmp/gh_headers -o /tmp/gh_user.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_INFRA_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "message=GH_INFRA_PAT rejected by GitHub API (HTTP ${HTTP_CODE}). Token is expired, revoked, or missing org SSO authorization." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          LOGIN=$(jq -r '.login' /tmp/gh_user.json)
          echo "Authenticated as GitHub user: ${LOGIN}"

          EXPIRY_HEADER=$(grep -i '^github-authentication-token-expiration:' /tmp/gh_headers | cut -d: -f2- | sed 's/^[[:space:]]*//' || true)
          if [ -n "$EXPIRY_HEADER" ]; then
            echo "GitHub API token expiry header: ${EXPIRY_HEADER}"
            echo "expiry_header=${EXPIRY_HEADER}" >> "$GITHUB_OUTPUT"
          fi

          if ! git ls-remote "https://x-access-token:${GH_INFRA_PAT}@github.com/${REPO}.git" HEAD >/dev/null 2>&1; then
            echo "status=repo_access_denied" >> "$GITHUB_OUTPUT"
            echo "message=GH_INFRA_PAT authenticates as ${LOGIN} but cannot read ${REPO}. Check fine-grained token repository access and org approval." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ -n "${GH_INFRA_PAT_EXPIRES_AT:-}" ]; then
            EXPIRES_EPOCH=$(date -d "${GH_INFRA_PAT_EXPIRES_AT}" +%s 2>/dev/null || true)
            if [ -n "$EXPIRES_EPOCH" ]; then
              NOW_EPOCH=$(date +%s)
              DAYS_LEFT=$(( (EXPIRES_EPOCH - NOW_EPOCH) / 86400 ))
              echo "days_left=${DAYS_LEFT}" >> "$GITHUB_OUTPUT"
              if [ "$DAYS_LEFT" -lt 0 ]; then
                echo "status=expired" >> "$GITHUB_OUTPUT"
                echo "message=GH_INFRA_PAT still authenticates but GH_INFRA_PAT_EXPIRES_AT (${GH_INFRA_PAT_EXPIRES_AT}) is in the past. Rotate the token now." >> "$GITHUB_OUTPUT"
                exit 1
              elif [ "$DAYS_LEFT" -le "${WARN_DAYS}" ]; then
                echo "status=warning" >> "$GITHUB_OUTPUT"
                echo "message=GH_INFRA_PAT expires in ${DAYS_LEFT} day(s) on ${GH_INFRA_PAT_EXPIRES_AT}. Rotate before Terraform/Helmsman checkout fails." >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "WARNING: GH_INFRA_PAT_EXPIRES_AT is set but not a valid YYYY-MM-DD date: ${GH_INFRA_PAT_EXPIRES_AT}"
            fi
          fi

          echo "status=ok" >> "$GITHUB_OUTPUT"
          echo "message=GH_INFRA_PAT is valid for ${REPO} (user: ${LOGIN})." >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### GH_INFRA_PAT validation"
            echo "- **Status:** \`${{ steps.validate.outputs.status || 'failed' }}\`"
            echo "- **Details:** ${{ steps.validate.outputs.message || 'Validation did not complete.' }}"
            if [ -n "${{ steps.validate.outputs.expiry_header }}" ]; then
              echo "- **API expiry header:** \`${{ steps.validate.outputs.expiry_header }}\`"
            fi
            if [ -n "${{ steps.validate.outputs.days_left }}" ]; then
              echo "- **Days until GH_INFRA_PAT_EXPIRES_AT:** \`${{ steps.validate.outputs.days_left }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Slack notification
        if: >-
          always()
          && (failure() || steps.validate.outputs.status == 'warning')
          && (github.event_name != 'workflow_dispatch' || github.event.inputs.notify_slack != 'false')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping Slack notification"
            exit 0
          fi

          if [ "${{ job.status }}" = "failure" ]; then
            COLOR="#E01E5A"
            TITLE=":rotating_light: GH_INFRA_PAT validation FAILED"
          else
            COLOR="#ECB22E"
            TITLE=":warning: GH_INFRA_PAT expiring soon"
          fi

          MESSAGE="${{ steps.validate.outputs.message }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg msg "$MESSAGE" \
              --arg repo "${{ github.repository }}" \
              --arg run "$RUN_URL" \
              --arg color "$COLOR" \
              '{attachments: [{color: $color, blocks: [
                {type: "section", text: {type: "mrkdwn", text: ("*" + $title + "*\n" + $msg)}},
                {type: "context", elements: [{type: "mrkdwn", text: ("Repo: " + $repo + " | <" + $run + "|View run>")}]}
              ]}]}')"
